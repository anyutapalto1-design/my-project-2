[project]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server for a personal Telegram account, built on Telethon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "telethon>=1.45,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
telegram-mcp = "telegram_mcp.__main__:main"
telegram-mcp-login = "telegram_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
